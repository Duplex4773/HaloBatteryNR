name: Rust Windows port
on:
  pull_request:
  push:
    branches: [main, port/rust-win32]
jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust-win32
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Audit upstream coverage mapping
        run: python tools/merge-coverage.py --check
      - run: cargo build --release --locked
      - name: Simulated lifecycle and resource smoke
        shell: pwsh
        run: ./tools/validate-native.ps1 -Seconds 15
      - name: Portable package
        shell: pwsh
        run: ./tools/package-rust.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HaloBatteryNext-windows-x64
          path: rust-win32/dist/HaloBatteryNext-0.1.0-windows-x64.zip
